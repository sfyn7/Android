plugins { id 'com.android.application' }

android {
    namespace 'com.staysobercora.app'
    compileSdk 35
    defaultConfig {
        applicationId "com.staysobercora.app"
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName "1.4"
    }
}
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.core:core:1.15.0'
    constraints {
        implementation('androidx.core:core:1.15.0') { because 'Stay Sober Cora compiles with Android API 35' }
        implementation('androidx.core:core-ktx:1.15.0') { because 'Stay Sober Cora compiles with Android API 35' }
    }
}