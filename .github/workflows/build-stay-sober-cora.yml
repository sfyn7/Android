name: Build Stay Sober Cora APK
on:
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Stay-Sober-Cora.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Stay-Sober-Cora-APK
          path: Stay-Sober-Cora.apk
          retention-days: 30
